name: Native packages
on:
  push:
    paths-ignore: [.github/workflows/publish.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux:
    if: ${{ !contains(github.event.head_commit.message, '[mac-only]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t winbox-static-builder -f packaging/linux-static.Dockerfile .
      - run: |
          mkdir -p build/linux-static
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/build/linux-static:/out" winbox-static-builder sh /src/packaging/build-linux-static.sh
      - name: Native Wayland and runtime tests
        run: docker run --rm -v "$PWD:/src:ro" -v "$PWD/build/linux-static:/out" winbox-static-builder sh /src/packaging/test-linux-static.sh
      - name: Debian 11 smoke
        run: |
          docker run --rm -v "$PWD/build/linux-static/dist:/app:ro" -v /usr/share/fonts:/usr/share/fonts:ro -e SDL_VIDEO_DRIVER=dummy debian:11-slim /app/winbox3-linux-amd64 --profile /tmp/profile --smoke-ms 1500
      - uses: actions/upload-artifact@v4
        with:
          name: winbox3-linux-amd64
          path: build/linux-static/dist/*
  macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: brew install cmake ninja pkgconf gperf
      - run: python3 -m pip install 'capstone>=5.0.7,<6' meson
      - uses: actions/cache/restore@v4
        id: sdk-cache
        with:
          path: build/macos-release/deps
          key: macos-10.14-sdk-v2-${{ hashFiles('packaging/sources.json') }}
      - name: Build macOS package
        shell: bash
        run: bash packaging/build-macos.sh 2>&1 | tee build-macos.log
      - uses: actions/cache/save@v4
        if: always() && steps.sdk-cache.outputs.cache-hit != 'true'
        with:
          path: build/macos-release/deps
          key: macos-10.14-sdk-v2-${{ hashFiles('packaging/sources.json') }}
      - name: Build diagnostics
        if: always()
        run: |
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -100 build-macos.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ '${{ job.status }}' = failure ]; then
            python3 - <<'PY'
          from pathlib import Path
          text = Path('build-macos.log').read_text(errors='replace')[-3500:]
          print('::error title=macOS build diagnostics::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: winbox3-macos-x86_64
          if-no-files-found: error
          path: |
            build/macos-release/dist/*.zip
            build/macos-release/dist/SHA256SUMS
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
      - name: Publish packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-assets
          cp packages/winbox3-linux-amd64/winbox3-linux-amd64 packages/winbox3-macos-x86_64/*.zip release-assets/
          cp LICENSE NOTICE packaging/sources.json release-assets/
          (cd release-assets; sha256sum winbox3-* > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" release-assets/* --title "$GITHUB_REF_NAME" --generate-notes --prerelease
