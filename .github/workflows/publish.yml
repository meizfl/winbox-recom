name: Publish validated packages
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish.yml]
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Native packages workflow run
        required: true
        default: '45500567427'
      linux_run:
        description: Workflow run containing the successful Linux job
        required: true
        default: '45500439237'
      tag:
        description: Existing preview tag for that source snapshot
        required: true
        default: v0.2.0-preview.3
permissions:
  contents: write
  actions: read
jobs:
  validate-builds:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BUILD_RUN: ${{ inputs.build_run || '45500567427' }}
      LINUX_RUN: ${{ inputs.linux_run || '45500439237' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for builds without occupying a macOS runner
        run: gh run watch "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30
      - name: Require the selected Linux job to have passed
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$LINUX_RUN/jobs?per_page=100" --jq '.jobs[] | select(.name == "linux") | .conclusion' | grep -qx success
  macos-package-smoke:
    needs: validate-builds
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    env:
      BUILD_RUN: ${{ inputs.build_run || '45500567427' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN }}
          name: winbox3-macos-${{ matrix.arch }}
          path: package
      - name: Run packaged app through Cocoa
        shell: bash
        run: |
          ditto -x -k package/winbox3-macos-${{ matrix.arch }}.zip "$RUNNER_TEMP/winbox-package"
          for theme in light dark; do
            WINBOX_TEST_PIXEL_GEOMETRY=1 SDL_VIDEO_DRIVER=cocoa "$RUNNER_TEMP/winbox-package/WinBox Recom.app/Contents/MacOS/winbox3" --profile "$RUNNER_TEMP/winbox-profile" --theme "$theme" --smoke-ms 2000 --screenshot "$RUNNER_TEMP/winbox-cocoa-$theme.png" 2>&1 | tee "cocoa-$theme.log"
            grep -q 'WinBox event loop ready' "cocoa-$theme.log"
            ! grep -qE 'lift stopped|WinBox presentation failed' "cocoa-$theme.log"
            test -s "$RUNNER_TEMP/winbox-cocoa-$theme.png"
          done
          cat cocoa-light.log cocoa-dark.log > cocoa.log
          python3 - <<'PYCOCOA'
          import re
          from pathlib import Path
          for theme in ('light','dark'):
              data=Path('cocoa-'+theme+'.log').read_text()
              frames=re.findall(r'points=(\d+)x(\d+) buffer=(\d+)x(\d+) frame=(\d+)x(\d+)',data)
              assert frames, 'Missing native framebuffer diagnostic'
              pw,ph,bw,bh,fw,fh=map(int,frames[-1])
              assert (bw,bh)==(fw,fh), 'Cocoa final frame was scaled'
              assert bw>=pw and bh>=ph
              print(theme, 'native points', (pw,ph), 'device-pixel buffer', (bw,bh))
          PYCOCOA
      - name: Report Cocoa failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('cocoa.log')
          text = path.read_text(errors='replace')[-3500:] if path.exists() else 'Package build or extraction failed before Cocoa smoke.'
          print('::error title=Cocoa package diagnostics::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
  publish:
    needs: macos-package-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      BUILD_RUN: ${{ inputs.build_run || '45500567427' }}
      LINUX_RUN: ${{ inputs.linux_run || '45500439237' }}
      PREVIEW_TAG: ${{ inputs.tag || 'v0.2.0-preview.3' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Require successful package validation
        run: gh run watch "$BUILD_RUN" --exit-status --interval 30
      - name: Require the Linux job to have passed
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$LINUX_RUN/jobs?per_page=100" --jq '.jobs[] | select(.name == "linux") | .conclusion' | grep -qx success
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.LINUX_RUN }}
          name: winbox3-linux-amd64
          path: packages/winbox3-linux-amd64
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN }}
          name: winbox3-macos-x86_64
          path: packages/winbox3-macos-x86_64
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN }}
          name: winbox3-macos-arm64
          path: packages/winbox3-macos-arm64
      - name: Publish validated artifacts
        shell: bash
        run: |
          {
            mkdir release-assets
            find packages -type f \( -name winbox3-linux-amd64 -o -name '*.zip' \) -exec cp '{}' release-assets/ \;
            test -f release-assets/winbox3-linux-amd64
            test -f release-assets/winbox3-macos-x86_64.zip
            test -f release-assets/winbox3-macos-arm64.zip
            cp LICENSE NOTICE packaging/sources.json release-assets/
            cp docs/screenshots/*.png release-assets/
            (cd release-assets; sha256sum winbox3-* > SHA256SUMS)
            source_commit=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq .head_sha)
            linux_commit=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$LINUX_RUN" --jq .head_sha)
            git fetch --no-tags origin "$source_commit" "$linux_commit"
            git diff --exit-code "$linux_commit" "$source_commit" -- runtime CMakeLists.txt tools/lift64.py tools/pe64.py tools/discover64.py winbox64.v3.43p10.exe packaging/build-linux-static.sh packaging/static_sdl_dbus.py packaging/SDL_waylandframebuffer.c packaging/fonts.conf packaging/linux-static.Dockerfile
            tag_commit=$(git rev-list -n 1 "$PREVIEW_TAG" 2>/dev/null || git ls-remote origin "refs/tags/$PREVIEW_TAG" | cut -f1)
            test "$tag_commit" = "$source_commit"
            gh release view "$PREVIEW_TAG" || gh release create "$PREVIEW_TAG" --verify-tag --title "WinBox Recom $PREVIEW_TAG — themes, icons and wallpapers" --notes-file "docs/releases/$PREVIEW_TAG.md" --prerelease
            gh release edit "$PREVIEW_TAG" --title "WinBox Recom $PREVIEW_TAG — themes, icons and wallpapers" --notes-file "docs/releases/$PREVIEW_TAG.md" --prerelease
            gh release upload "$PREVIEW_TAG" release-assets/* --clobber
          } 2>&1 | tee publish.log
      - name: Report publication failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('publish.log')
          text = path.read_text(errors='replace')[-3500:] if path.exists() else 'Build validation or artifact download failed before publication.'
          print('::error title=Publish diagnostics::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
