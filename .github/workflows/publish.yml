name: Publish validated packages
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish.yml]
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Native packages workflow run
        required: true
        default: '45440476400'
      linux_run:
        description: Workflow run containing the successful Linux job
        required: true
        default: '45438502769'
      tag:
        description: Preview tag for that source snapshot
        required: true
        default: v0.1.0-preview.2
permissions:
  contents: write
  actions: read
jobs:
  macos-package-smoke:
    runs-on: macos-15-intel
    timeout-minutes: 50
    env:
      BUILD_RUN: ${{ inputs.build_run || '45440476400' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Require successful package validation
        run: gh run watch "$BUILD_RUN" --exit-status --interval 30
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN }}
          name: winbox3-macos-x86_64
          path: package
      - name: Run packaged app through Cocoa
        shell: bash
        run: |
          ditto -x -k package/winbox3-macos-x86_64.zip "$RUNNER_TEMP/winbox-package"
          SDL_VIDEO_DRIVER=cocoa "$RUNNER_TEMP/winbox-package/WinBox Recom.app/Contents/MacOS/winbox3" --profile "$RUNNER_TEMP/winbox-profile" --smoke-ms 2000 --screenshot "$RUNNER_TEMP/winbox-cocoa.png" 2>&1 | tee cocoa.log
          grep -q 'WinBox event loop ready' cocoa.log
          ! grep -qE 'lift stopped|WinBox presentation failed' cocoa.log
          test -s "$RUNNER_TEMP/winbox-cocoa.png"
      - name: Report Cocoa failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('cocoa.log')
          text = path.read_text(errors='replace')[-3500:] if path.exists() else 'Package build or extraction failed before Cocoa smoke.'
          print('::error title=Cocoa package diagnostics::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
  publish:
    needs: macos-package-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      BUILD_RUN: ${{ inputs.build_run || '45440476400' }}
      LINUX_RUN: ${{ inputs.linux_run || '45438502769' }}
      PREVIEW_TAG: ${{ inputs.tag || 'v0.1.0-preview.2' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Require successful package validation
        run: gh run watch "$BUILD_RUN" --exit-status --interval 30
      - name: Require the Linux job to have passed
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$LINUX_RUN/jobs?per_page=100" --jq '.jobs[] | select(.name == "linux") | .conclusion' | grep -qx success
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.LINUX_RUN }}
          name: winbox3-linux-amd64
          path: packages/winbox3-linux-amd64
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN }}
          name: winbox3-macos-x86_64
          path: packages/winbox3-macos-x86_64
      - name: Publish validated artifacts
        shell: bash
        run: |
          {
            mkdir release-assets
            find packages -type f \( -name winbox3-linux-amd64 -o -name '*.zip' \) -exec cp '{}' release-assets/ \;
            test -f release-assets/winbox3-linux-amd64
            test -f release-assets/winbox3-macos-x86_64.zip
            cp LICENSE NOTICE packaging/sources.json release-assets/
            (cd release-assets; sha256sum winbox3-* > SHA256SUMS)
            source_commit=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq .head_sha)
            linux_commit=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$LINUX_RUN" --jq .head_sha)
            git fetch --no-tags origin "$source_commit" "$linux_commit"
            git diff --exit-code "$linux_commit" "$source_commit" -- runtime CMakeLists.txt tools/lift64.py tools/pe64.py tools/discover64.py winbox64.v3.43p10.exe packaging/build-linux-static.sh packaging/static_sdl_dbus.py packaging/SDL_waylandframebuffer.c packaging/fonts.conf packaging/linux-static.Dockerfile
            gh release view "$PREVIEW_TAG" || gh release create "$PREVIEW_TAG" --target "$source_commit" --title "$PREVIEW_TAG" --notes 'Native Linux amd64 static ELF and macOS Intel app targeting 10.14. Runtime tests, native headless Wayland and Debian 11 smoke are required to pass. Experimental compatibility runtime; physical macOS 10.14 validation remains outstanding.' --prerelease
            gh release upload "$PREVIEW_TAG" release-assets/* --clobber
          } 2>&1 | tee publish.log
      - name: Report publication failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('publish.log')
          text = path.read_text(errors='replace')[-3500:] if path.exists() else 'Build validation or artifact download failed before publication.'
          print('::error title=Publish diagnostics::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
