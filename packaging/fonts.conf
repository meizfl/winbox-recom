<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/Library/Fonts</dir>
  <dir>~/Library/Fonts</dir>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <alias><family>Tahoma</family><prefer><family>Arial</family><family>Helvetica</family><family>DejaVu Sans</family></prefer></alias>
  <alias><family>Courier New</family><prefer><family>Courier</family><family>Menlo</family><family>DejaVu Sans Mono</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Tahoma</family><family>Arial</family><family>Helvetica</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Courier New</family><family>Menlo</family><family>Courier</family></prefer></alias>
</fontconfig>
